services:
  arangodb:
    image: arangodb/arangodb:3.12
    container_name: arangodb
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=openSesame
    volumes:
      - arango_data:/var/lib/arangodb3

volumes:
  arango_data:
    driver: local